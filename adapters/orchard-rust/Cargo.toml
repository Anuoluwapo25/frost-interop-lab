[package]
name = "orchard-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "FROST Interop Lab adapter built on the official orchard and zcash_keys crates"
publish = false

[dependencies]
blake2b_simd = "1"
blake3 = "1"
ff = "0.13"
frost-rerandomized = "3.0.0"
hex = "0.4"
incrementalmerkletree = "0.8.1"
orchard = "0.15"
pasta_curves = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
reddsa = { version = "=0.5.2", features = ["frost"] }
serde_json = "1"
zcash_keys = { version = "0.15", features = ["orchard", "unstable-frost"] }
zcash_protocol = "0.10"
